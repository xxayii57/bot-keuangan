server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /var/www/html;
    index index.html;

    # Redirect short theme URLs to long URLs dynamically (Supports v1 up to v10!)
    location = /register {
        return 302 $scheme://$http_host/pesan.html$is_args$args;
    }

    location ~ ^/v([1-9]|10)/(.+)$ {
        return 302 $scheme://$http_host/themes/v$1/index.html?id=$2;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ $uri.html /route.php?slug=$uri;
    }

    location /laporan-pengunjung {
        auth_basic "Area Terbatas - Undangan Intim";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /laporan-pengunjung.html =404;
    }

    location = /api/sayabayar-callback {
        rewrite ^/api/sayabayar-callback$ /server-api.php?action=sayabayar-callback last;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8089/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
