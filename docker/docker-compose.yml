services:
  # ─────────────────────────────────────────────
  # IntimClaw Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm intimclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  intimclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/sipeed/intimclaw:latest
    container_name: intimclaw-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.intimclaw
    entrypoint: ["intimclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # IntimClaw Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  intimclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/sipeed/intimclaw:latest
    container_name: intimclaw-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.intimclaw

  # ─────────────────────────────────────────────
  # IntimClaw Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  intimclaw-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: docker.io/sipeed/intimclaw:launcher
    container_name: intimclaw-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - INTIMCLAW_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- INTIMCLAW_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.intimclaw
